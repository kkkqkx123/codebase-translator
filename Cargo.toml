[package]
name = "codebase-translate"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Codebase Translate Team"]
description = "Automatic code comment and documentation translator"
license = "MIT"
repository = "https://github.com/yourusername/codebase-translate"

[[bin]]
name = "translator"
path = "src/main.rs"

[dependencies]
# 异步运行时
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
async-trait = "0.1"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# 错误处理
thiserror = "2.0"
anyhow = "1.0"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }
tracing-appender = "0.2.4"

# HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Tree-sitter
tree-sitter = "0.26"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-typescript = "0.23"
streaming-iterator = "0.1"

# 文件系统
walkdir = "2.5"
glob = "0.3"

# 文本处理
regex = "1.11"
whatlang = "0.16"
unicase = "2.8"
encoding_rs = "0.8"

# 压缩
brotli = "6.0"
flate2 = "1.1"

# 哈希
sha2 = "0.10"
hmac = "0.12"
hex = "0.4.3"
crc32fast = "1.4"

# 速率限制
governor = "0.10"

# 随机数
rand = "0.8"

# 缓存
sled = "0.34"

# CLI
clap = { version = "4.5", features = ["derive"] }

# 表格和CSV输出
comfy-table = "7.1"
csv = "1.3"

# 工具
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.1"
once_cell = "1.21"
dotenvy = "0.15"
dirs = "6.0"
rayon = "1.10"



[dev-dependencies]
tempfile = "3.21"
mockall = "0.13"
pretty_assertions = "1.4"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
