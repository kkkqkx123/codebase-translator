provider = "DeepLX"
enabled_providers = []

[deeplx]
api_url = "http://localhost:1188"
rate_limit = 10
max_retries = 3

[llm]
providers = []

[llm.health_check]
enabled = true
interval = 30
timeout = 5
failure_threshold = 3
recovery_interval = 60

[tencent]
region = "ap-guangzhou"
project_id = 0
endpoint = "tmt.tencentcloudapi.com"
timeout = 30
rate_limit = 5
max_retries = 3
untranslated_text = []
term_repo_id_list = []
sent_repo_id_list = []

[logging]
level = "info"
output = "stdout"
format = "pretty"

[limits]
rate_limit = 10
max_char_count = 0
split_max_chars = 1000
